<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistem Absensi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f1923;
    --ink-mid: #2d3748;
    --muted: #718096;
    --accent: #e85d2f;
    --accent-dark: #c0431c;
    --surface: #ffffff;
    --bg: #f5f0eb;
    --border: #e2d9cf;
    --success: #2e7d32;
    --error: #c0392b;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    right: -20%;
    width: 70vw;
    height: 70vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,93,47,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    left: -10%;
    width: 50vw;
    height: 50vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15,25,35,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 2.5rem 2.5rem 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(15,25,35,0.12), 0 4px 16px rgba(15,25,35,0.06);
    position: relative;
    animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .brand-icon {
    width: 44px;
    height: 44px;
    background: var(--ink);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-icon svg { width: 24px; height: 24px; fill: white; }

  .brand-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--ink);
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 1px;
  }

  .form-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem;
    color: var(--ink);
    margin-bottom: 0.4rem;
  }

  .form-subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 1.75rem;
  }

  .field {
    margin-bottom: 1.1rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-mid);
    margin-bottom: 0.4rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--bg);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
    background: white;
    box-shadow: 0 0 0 3px rgba(232,93,47,0.1);
  }

  .btn {
    width: 100%;
    padding: 0.85rem;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn:hover { background: var(--ink-mid); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    padding: 0.75rem 1rem;
    border-radius: 0.6rem;
    font-size: 0.85rem;
    margin-top: 1rem;
    display: none;
  }

  .alert-error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
  .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.5rem 0;
  }

  .info-box {
    background: var(--bg);
    border-radius: 0.75rem;
    padding: 0.85rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .info-box strong { color: var(--ink-mid); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="brand-text">
      <h1>SiAbsen Pro</h1>
      <p>Sistem Absensi Sekolah</p>
    </div>
  </div>

  <h2 class="form-title">Selamat datang</h2>
  <p class="form-subtitle">Masuk untuk melanjutkan ke sistem</p>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="guru@sekolah.sch.id" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="loginBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Masuk</span>
    </button>
    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>
  </form>

  <div class="divider"></div>
  <div class="info-box">
    <strong>Default Admin:</strong><br>
    Email: admin@sekolah.sch.id<br>
    Password: admin123
  </div>
</div>

<script>
const loginForm = document.getElementById('loginForm');
const alertError = document.getElementById('alertError');
const alertSuccess = document.getElementById('alertSuccess');
const loginBtn = document.getElementById('loginBtn');
const spinner = document.getElementById('spinner');
const btnText = document.getElementById('btnText');

function setLoading(v) {
  loginBtn.disabled = v;
  spinner.style.display = v ? 'block' : 'none';
  btnText.textContent = v ? 'Memproses...' : 'Masuk';
}

function showAlert(type, msg) {
  alertError.style.display = 'none';
  alertSuccess.style.display = 'none';
  if (type === 'error') { alertError.textContent = msg; alertError.style.display = 'block'; }
  else { alertSuccess.textContent = msg; alertSuccess.style.display = 'block'; }
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  setLoading(true);
  alertError.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (data.success) {
      // Simpan session
      localStorage.setItem('teacher', JSON.stringify(data.teacher));
      localStorage.setItem('assignments', JSON.stringify(data.assignments || []));
      showAlert('success', 'Login berhasil! Mengalihkan...');

      setTimeout(() => {
        // Redirect berdasarkan role dan context
        const isWebView = navigator.userAgent.includes('wv') || 
                          window.location.search.includes('mobile=1') ||
                          window.innerWidth <= 480;
        
        if (data.teacher.role === 'admin') {
          window.location.href = '/dashboard';
        } else if (isWebView) {
          window.location.href = '/absensi';
        } else {
          window.location.href = '/dashboard';
        }
      }, 600);
    } else {
      showAlert('error', data.message || 'Login gagal');
    }
  } catch (err) {
    showAlert('error', 'Tidak dapat terhubung ke server. Pastikan server aktif.');
  } finally {
    setLoading(false);
  }
});

// Auto-fill jika sudah login
const stored = localStorage.getItem('teacher');
if (stored) {
  try {
    const t = JSON.parse(stored);
    // Verify session masih valid
    fetch('/api/classes', { headers: { 'x-teacher-id': t.id } })
      .then(r => { if (r.ok && t.role === 'admin') window.location.href = '/dashboard'; })
      .catch(() => {});
  } catch {}
}
</script>
</body>
</html>
