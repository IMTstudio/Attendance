<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa — SiAbsen Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --ink: #0f1923;
    --ink-mid: #2d3748;
    --muted: #718096;
    --accent: #e85d2f;
    --surface: #ffffff;
    --bg: #f5f0eb;
    --border: #e2d9cf;
    --success: #2e7d32;
    --error: #c0392b;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; }
  
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
    background: var(--ink); color: white; padding: 1.5rem; overflow-y: auto; z-index: 100;
  }

  .brand {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;
    padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .brand-icon {
    width: 40px; height: 40px; background: var(--accent); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-icon svg { width: 22px; height: 22px; fill: white; }
  .brand-text h1 { font-family: 'DM Serif Display', serif; font-size: 1rem; }
  .brand-text p { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px; }

  .nav-menu { list-style: none; }
  .nav-item { margin-bottom: 0.25rem; }
  .nav-link {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
    color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 0.5rem;
    transition: all 0.2s; font-size: 0.9rem; font-weight: 500;
  }
  .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }
  .nav-link svg { width: 18px; height: 18px; fill: currentColor; }

  .user-info {
    margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .user-name { font-weight: 600; font-size: 0.9rem; }
  .user-role { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .btn-logout {
    margin-top: 0.75rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.1);
    border: none; color: white; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; width: 100%;
  }

  .main-content { margin-left: 260px; padding: 2rem; flex: 1; }
  .page-header { margin-bottom: 2rem; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--ink); margin-bottom: 0.5rem; }
  .page-subtitle { color: var(--muted); font-size: 0.9rem; }

  .actions-bar {
    display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }

  .btn {
    padding: 0.75rem 1.25rem; border-radius: 0.5rem; border: none; cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #c0431c; }
  .btn-success { background: var(--success); color: white; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--ink); }

  .card {
    background: var(--surface); border-radius: 1rem; padding: 1.5rem;
    box-shadow: 0 4px 20px rgba(15,25,35,0.06); border: 1px solid var(--border);
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }

  .badge { padding: 0.25rem 0.6rem; border-radius: 0.4rem; font-size: 0.75rem; font-weight: 600; }
  .badge-class { background: var(--bg); color: var(--ink); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal {
    background: var(--surface); border-radius: 1rem; padding: 2rem;
    width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.3rem; margin-bottom: 1.5rem; }
  
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-mid); margin-bottom: 0.4rem; }
  .form-group input, .form-group select {
    width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 0.5rem;
    font-family: inherit; font-size: 0.9rem;
  }
  .form-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }

  @media (max-width: 768px) {
    .sidebar { width: 100%; height: auto; position: relative; padding: 1rem; }
    .main-content { margin-left: 0; padding: 1rem; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <div class="brand-text"><h1>SiAbsen Pro</h1><p>Admin Panel</p></div>
  </div>
  <ul class="nav-menu">
    <li class="nav-item"><a href="/dashboard" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Dashboard</a></li>
    <li class="nav-item"><a href="/data-siswa" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Data Siswa</a></li>
    <li class="nav-item"><a href="/pelanggaran-dashboard" class="nav-link"><svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.83L19.17 19H2.83L12 5.83zM11 16h2v2h-2v-2zm0-6h2v4h-2v-4z"/></svg>Pelanggaran</a></li>
    <li class="nav-item"><a href="/absensi" class="nav-link"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>Input Absensi</a></li>
  </ul>
  <div class="user-info">
    <div class="user-name" id="userName">-</div>
    <div class="user-role" id="userRole">-</div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="main-content">
  <div class="page-header">
    <h1 class="page-title">Data Siswa</h1>
    <p class="page-subtitle">Kelola data siswa dan upload CSV</p>
  </div>

  <div class="actions-bar">
    <button class="btn btn-primary" onclick="openModal()">+ Tambah Siswa</button>
    <button class="btn btn-success" onclick="document.getElementById('csvInput').click()">📁 Upload CSV</button>
    <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="uploadCSV(this)">
    <button class="btn btn-outline" onclick="loadStudents()">↻ Refresh</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Aksi</th></tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle">Tambah Siswa</h2>
    <form id="studentForm">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>NISN</label>
        <input type="text" id="nisn" placeholder="Nomor Induk Siswa Nasional">
      </div>
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required>
      </div>
      <div class="form-group">
        <label>Kelas</label>
        <select id="kelasSelect" required></select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script>
let classes = [];

document.addEventListener('DOMContentLoaded', () => {
  const stored = localStorage.getItem('teacher');
  if (!stored) { window.location.href = '/'; return; }
  const teacher = JSON.parse(stored);
  document.getElementById('userName').textContent = teacher.name;
  document.getElementById('userRole').textContent = teacher.role === 'admin' ? 'Administrator' : 'Guru';
  
  loadClasses();
  loadStudents();
});

async function loadClasses() {
  const res = await fetch('/api/classes');
  classes = await res.json();
  const sel = document.getElementById('kelasSelect');
  sel.innerHTML = '<option value="">Pilih Kelas</option>' + classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

async function loadStudents() {
  const res = await fetch('/api/students');
  const students = await res.json();
  const tbody = document.getElementById('studentTableBody');
  tbody.innerHTML = students.map(s => `
    <tr>
      <td>${s.nisn || '-'}</td>
      <td>${s.name}</td>
      <td><span class="badge badge-class">${s.class_name || 'Belum ada kelas'}</span></td>
      <td>
        <button class="btn btn-outline" style="padding:0.4rem 0.6rem;font-size:0.75rem" onclick="editStudent(${s.id})">Edit</button>
        <button class="btn btn-outline" style="padding:0.4rem 0.6rem;font-size:0.75rem;color:var(--error);border-color:#fecaca" onclick="deleteStudent(${s.id})">Hapus</button>
      </td>
    </tr>
  `).join('');
}

function openModal() {
  document.getElementById('modalTitle').textContent = 'Tambah Siswa';
  document.getElementById('editId').value = '';
  document.getElementById('studentForm').reset();
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function editStudent(id) {
  // Implementasi edit bisa ditambahkan
  alert('Fitur edit akan segera hadir!');
}

async function deleteStudent(id) {
  if (!confirm('Yakin ingin menghapus siswa ini?')) return;
  await fetch(`/api/students/${id}`, { method: 'DELETE', headers: { 'x-teacher-id': JSON.parse(localStorage.getItem('teacher')).id } });
  loadStudents();
}

document.getElementById('studentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const data = {
    nisn: document.getElementById('nisn').value,
    name: document.getElementById('nama').value,
    class_id: document.getElementById('kelasSelect').value
  };
  
  await fetch(editId ? `/api/students/${editId}` : '/api/students', {
    method: editId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json', 'x-teacher-id': JSON.parse(localStorage.getItem('teacher')).id },
    body: JSON.stringify(data)
  });
  
  closeModal();
  loadStudents();
});

async function uploadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  
  const formData = new FormData();
  formData.append('csvFile', file);
  formData.append('mode', 'merge');
  
  await fetch('/api/students/upload', {
    method: 'POST',
    headers: { 'x-teacher-id': JSON.parse(localStorage.getItem('teacher')).id },
    body: formData
  });
  
  alert('Upload berhasil!');
  loadStudents();
  input.value = '';
}

function logout() {
  localStorage.removeItem('teacher');
  window.location.href = '/';
}
</script>
</body>
</html>
